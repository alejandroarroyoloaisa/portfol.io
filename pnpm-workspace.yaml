packages:
  - "apps/*"
  - "packages/*"
nodeLinker: hoisted
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.12'
  - '@turbo/darwin-arm64@2.11.12'
  - '@turbo/linux-64@2.11.12'
  - '@turbo/linux-arm64@2.11.12'
  - '@turbo/windows-64@2.11.12'
  - '@turbo/windows-arm64@2.11.12'
  - '@vitest/coverage-v8@5.1.1'
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - turbo@2.11.12
  - vitest@5.1.1
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  sharp: true
  esbuild: true
  "@swc/core": true
  "@nestjs/core": true
  "@scarf/scarf": false
