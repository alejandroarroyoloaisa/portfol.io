name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_USER: portfolio, POSTGRES_PASSWORD: portfolio, POSTGRES_DB: portfolio_test }
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://portfolio:portfolio@localhost:5434/portfolio_test?schema=public
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5434/portfolio_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Tipos (todas las apps)
        run: pnpm typecheck
      - name: Pruebas de dominio (cobertura) y de integración de la API
        run: pnpm test
      - name: Compilación de la web
        run: pnpm --filter @portfolio/web build
      - name: Exportación web de la app móvil (comprueba que el bundle compila)
        run: pnpm --filter @portfolio/mobile export:web
